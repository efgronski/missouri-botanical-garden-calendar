[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "missouri-botanical-garden-calendar"
version = "0.1.0"
description = "A self-updating iCalendar feed for Missouri Botanical Garden events"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "icalendar>=6,<7", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
