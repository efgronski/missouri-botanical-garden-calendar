name: Update calendar

on:
  schedule:
    - cron: "37 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh SSL certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          python -m pip install --upgrade certifi
          python -c "import certifi; print(certifi.where())"

      - name: Add missing Garden intermediate certificate
        run: |
          # Download the intermediate certificate from DigiCert
          curl --fail --show-error --location \
            https://cacerts.digicert.com/GeoTrustTLSRSACAG1.crt.pem \
            --output "$RUNNER_TEMP/geotrust-intermediate.pem"

          # Confirm the certificate we downloaded
          openssl x509 \
            -in "$RUNNER_TEMP/geotrust-intermediate.pem" \
            -noout -subject -issuer -dates

          # Combine it with the normal certifi trust bundle
          cat "$(python -c 'import certifi; print(certifi.where())')" \
            "$RUNNER_TEMP/geotrust-intermediate.pem" \
            > "$RUNNER_TEMP/requests-ca-bundle.pem"

          # Tell Python requests to use the combined bundle
          echo "REQUESTS_CA_BUNDLE=$RUNNER_TEMP/requests-ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Test Garden connection
        run: |
          python -c "import requests; r=requests.get('https://www.missouribotanicalgarden.org/events-classes/calendar', timeout=30); print('Status:', r.status_code); r.raise_for_status()"
          
      - run: pytest
      - run: python -m mobot_calendar

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/events.json output/mobot.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json output/mobot.ics
          git commit -m "chore: update Garden calendar"
          git push
