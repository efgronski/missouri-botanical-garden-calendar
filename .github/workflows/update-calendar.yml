name: Update calendar

on:
  schedule:
    - cron: "37 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh SSL certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          python -m pip install --upgrade certifi
          python -c "import certifi; print(certifi.where())"

      - name: Diagnose Garden SSL certificate
        run: |
          echo "===== WWW DOMAIN ====="
          openssl s_client \
            -connect www.missouribotanicalgarden.org:443 \
            -servername www.missouribotanicalgarden.org \
            -showcerts -verify_return_error \
            </dev/null 2>&1 | grep -E 'depth=|verify error|Verify return code|subject=|issuer=' || true

          echo ""
          echo "===== ROOT DOMAIN ====="
          openssl s_client \
            -connect missouribotanicalgarden.org:443 \
            -servername missouribotanicalgarden.org \
            -showcerts -verify_return_error \
            </dev/null 2>&1 | grep -E 'depth=|verify error|Verify return code|subject=|issuer=' || true

      - run: pytest
      - run: python -m mobot_calendar

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/events.json output/mobot.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json output/mobot.ics
          git commit -m "chore: update Garden calendar"
          git push
