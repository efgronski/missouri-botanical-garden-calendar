name: Update calendar

on:
  schedule:
    - cron: "37 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh SSL certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          python -m pip install --upgrade certifi
          python -c "import certifi; print(certifi.where())"

      - name: Inspect Garden certificate chain
        run: |
          for host in www.missouribotanicalgarden.org missouribotanicalgarden.org; do
            echo ""
            echo "===== $host ====="

            openssl s_client \
              -connect "$host:443" \
              -servername "$host" \
              -showcerts </dev/null 2>/dev/null |
              awk -v prefix="/tmp/$host" '
                /BEGIN CERTIFICATE/ {
                  n++
                  file=prefix "-" n ".pem"
                }
                file {print > file}
                /END CERTIFICATE/ {
                  close(file)
                  file=""
                }
                END {
                  print "Certificates sent by server:", n+0
                }
              '

            for cert in /tmp/"$host"-*.pem; do
              [ -f "$cert" ] || continue
              echo "--- Certificate details ---"
              openssl x509 -in "$cert" -noout \
                -subject -issuer -dates
            done
          done
          
      - run: pytest
      - run: python -m mobot_calendar

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/events.json output/mobot.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json output/mobot.ics
          git commit -m "chore: update Garden calendar"
          git push
